# Attune settings. Copy to config/attune.toml (gitignored) and edit there.
# Shared file: add keys in a [shared] PR. Values come from the build plan; tune them at calibration.

[engine]
host = "127.0.0.1"
port = 8000
data_dir = "data"
models_dir = "models"

# ---------- Section 1 - Vision ----------
[vision]
camera_name = "Logitech"        # matched against the device name, never index 0
width = 1920
height = 1080
fps = 30
det_size = 960                  # T-S3 picks 640 / 960 / 1280
min_face_px = 36
min_crop_px = 60
match_threshold = 0.45
match_margin = 0.08
match_hits = 3                  # within 1 s
recheck_s = 2.0
track_survive_s = 1.0
lost_list_s = 10.0
enroll_crops = 8
enroll_min_crops = 5
# Light-ASD (V-22): lips + sound decide who is talking. Weights: scripts/download_models.py light_asd
asd_enabled = true              # false, or weights missing: the lip score decides alone
asd_device = "cuda"             # ~25-80 ms a round; "cpu" is ~150 ms idle but ~600 ms in a busy engine
asd_rate_hz = 5                 # scoring rounds per second, all faces in one batch
asd_window_s = 1.5
asd_min_face_px = 40
asd_min_fps = 12                # vision slower than this: no score, the lip score decides
asd_av_offset_s = 0.0           # audio lags video by this much

[fusion]
# Lip score = band-passed mouth movement (V-19; the old plain std was about 2.5x larger).
lip_talking = 0.012             # moving like a talker
lip_uncertain = 0.008           # probable band: lip_uncertain .. lip_talking
lip_floor_s = 15                # per-face noise floor: this face's own recent lip score...
lip_floor_min_s = 3
lip_floor_pct = 10              # ...its 10th percentile...
lip_floor_ratio = 1.5           # ...and a face must also reach 1.5x it
talk_cover_share = 0.7          # moving in time for 70% of the current speech run
talk_confirm_s = 0.25           # minimum duration before assigning a face
talk_onset_s = 0.4              # starts near speech onset or a turn
talk_sustain_s = 1.5            # window for repeated mouth swings when joining mid-speech
lip_open_max = 0.6              # wider open than this = yawn or laugh, not speech
head_motion_max = 0.8           # face widths/s; faster = blurred lips, not measured
talk_min_swings = 4             # joining mid-speech: open/close swings needed over talk_sustain_s
talk_swing_amp = 0.03           # open ratio change that counts as a swing
mouth_min_fps = 6.0             # fewer mouth samples a second: mouth not judged (starved GPU)
sync_min_corr = 0.3             # lips in time with the sound: required when there is sound
av_window_s = 1.5
require_sync = true             # false only for film reels over unrelated audio
voice_reject = 0.25             # minimum margin used when learning a new off-screen voice
harvest_min_corr = 0.4          # learn a face's voice only when this far in time
learn_offscreen = true          # learn voices heard while every visible face is still as offscreen-N
offscreen_claim_s = 3.0         # a face talking this long with an offscreen-N voice claims it
hold_s = 0.5
switch_ratio = 1.5
voice_match = 0.5
offscreen_exit_memory_s = 30
side_db = 3.0
asd_use = true                  # a face with a fresh Light-ASD score talks only when it says so
asd_on = 0.5                    # score (logit) that starts a face talking...
asd_off = -0.5                  # ...and that stops it again
harvest_after_s = 1.5
first_words_wait_ms = 300
rate_hz = 15

# ---------- Section 2 - Audio & Language ----------
[audio]
device_name = "Logitech"
sample_rate = 48000
block_ms = 10
vad_start = 0.5
vad_end = 0.35
min_speech_ms = 250
end_silence_ms = 400
asr_chunk_ms = 32                # feed the recogniser every VAD frame: it decodes each 560 ms chunk
                                # as soon as its audio is in (A-22; 560 made words wait ~0.45 s more)
pre_roll_ms = 320               # audio kept before speech starts; padded with silence when shorter
languages = ["en", "es"]        # empty = auto-detect
mute_after_reply_s = 0.5
soft_split_s = 5                # a longer utterance ends at its next pause, so finals (history,
                                # translation) keep coming during a monologue (10 s: ~12 s late)
soft_split_gap_s = 0.1          # ...a pause is this much silence (the VAD dips inside words too)
split_context_s = 120           # a split carries on the recogniser's stream (a fresh one drops the
                                # first words of quiet speech) until it has heard this much
max_utterance_s = 30
target_rms = 0.1
rescue_max_s = 2.5              # a short utterance heard as nothing is decoded again on the side
voice_match_every_s = 1.0       # voice match at most this often per utterance (and at its end)...
voice_match_max_s = 6.0         # ...on its newest 6 s of speech (the whole utterance stalled audio)
inbox_s = 30                    # audio queued while a step is slow is kept, never dropped

[alerts]
window_s = 1.0
hop_s = 0.5
smoke_score = 0.5
watch_score = 0.3
doorbell_score = 0.4
doorbell_rest_s = 5
realert_s = 30
clear_quiet_s = 15
watch_s = 10
speech_music_block = 0.5

[llm]
model = "qwen3.5:4b"
fallback_model = "qwen3.5:2b"
num_ctx = 4096
keep_alive = -1
think = false
temperature = 0
proposal_expiry_s = 10
name_confidence = 0.8
timeout_s = 1.5
max_queue = 32
reply_context_lines = 6
reply_delay_s = 1.0              # A-23: suggest replies once the talk pauses, not after every final
description_max_px = 224         # clothing crops are shrunk to this before the model reads them
[llm.timeouts]                   # per job kind; others use timeout_s. A slow job is skipped and
translation = 4.0                # never blocks a translation (it is stopped and runs after it)
names = 3.0
replies = 4.0
descriptions = 4.0

# ---------- Section 3 - Hardware & Services ----------
[hardware]
baud = 115200
ready_timeout_s = 3
heartbeat_s = 0.5
report_ms = 50
tap_ms = 400
hold_ms = 800
led_brightness = 180

[speech_out]
fallback_after_s = 1.5
presets = [
    "Nice to meet you",
    "Can you repeat that?",
    "One moment",
    "Thank you",
    "I read captions, go ahead",
]

[history]
db_path = "data/history.db"
retention_hours = 24             # rows older than this are deleted
orphan_draft_s = 10              # a draft caption whose final never came is saved after this long

# ---------- Section 4 - Pages ----------
[pages]
frame_width = 1280
frame_height = 720
jpeg_quality = 80
bubble_chars = 42
bubble_lines = 2
bubble_fade_s = 4

# Save a person with a double tap (P-29, engine/attune/core/save_flow.py)
[save]
consent_timeout_s = 60           # the phone's consent sheet waits this long, then save.cancel
proposal_grace_s = 5             # a name confirmed this recently still counts as "this person"
speaker_recent_s = 10            # the last named speaker counts as "this person" this long
scene_stale_s = 2                # faces from an older scene are not "in view"
enrolling_s = 90                 # a started enrollment blocks a second request for that face

# Section 2 runtime/model settings. Paths must already exist; services never download.
[nemotron]
tokens = "models/nemotron/tokens.txt"
encoder = "models/nemotron/encoder.int8.onnx"
decoder = "models/nemotron/decoder.int8.onnx"
joiner = "models/nemotron/joiner.int8.onnx"
provider = "cpu"
num_threads = 2
flush_s = 0.4                   # silence after a final: 0.4 decodes every last word, 0.8 cost ~0.2 s
word_settle_s = 1.5             # a split mid-talk keeps the last word for the next utterance
                                # (it may be half decoded) unless this much audio came after it

[whisper]
model_path = "models/faster-whisper-large-v3-turbo"
device = "cpu"
compute_type = "int8"
draft_interval_ms = 560       # Whisper re-decodes the growing utterance; 32 ms would fall behind live audio

[voice]
model_path = "models/cam++.onnx"
provider = "cpu"
enroll_s = 5.0
enroll_timeout_s = 45.0          # voice enrollment gives up ("not enough speech") after this
match_s = 1.0
# A-21 cross-mic: a print made on the laptop mic (enrollment station) is heard on the glasses
# mic. Its own threshold; its scores are shifted onto the [fusion] voice_match scale. Simulated
# laptop->glasses study (scripts/eval_crossmic.py, 29 TTS voices, CAM++ with the 2 s length
# fix): EER 1.7%; at 0.5 1.0% false accepts, 3.7% misses on 2-3 s utterances (23% at 1.5 s).
# No separate value was needed.
station_match = 0.5
# Bounded refinement: glasses-mic speech of a saved person (confident face, lip-synced talker,
# one talker, >= harvest_after_s) that scores >= adapt_min against their base print joins a
# small bank of glasses prints; their score is the better of the base print and the bank's
# mean, the bank's measured against bank_match. The base print is never replaced.
# Study: 8 bank prints cut misses at 0.1% false accepts from 22% to 2%; 0.53 keeps the bank's
# false accepts at 1% (0.5 would let in 1.6%). Gate 0.45 passes 88% of the person's 1.5 s
# utterances and 0.85% of someone else's.
bank_match = 0.53
adapt_min = 0.45
adapt_max_prints = 8
adapt_min_s = 1.5                # voiced seconds in the harvested span
adapt_gap_s = 5.0                # at most one adaptation per person this often
adapt_persist = true             # keep the bank in voice.json (deleted with the person)
harvest_lag_s = 0.4              # harvests wait this long so their audio has arrived

# Enrollment station (V-23, A-21, P-35): people are saved at the laptop's own camera and mic;
# the glasses camera and mic are for the world outside. engine/attune/station/
[enroll]
source = "station"               # "station" (laptop camera + mic) or "glasses" (the P-29 flow)
camera_name = "OV02E10"          # laptop camera (substring of the device name; IR cameras never)
mic_name = "Microphone Array"    # laptop mic (substring, WASAPI); never falls back to another mic
camera_width = 1280
camera_height = 720
camera_fps = 30
open_timeout_s = 6               # no frames / audio this long after opening: busy or missing
preview_width = 360              # phone preview: 3:4 crop from the middle, JPEG, memory only
preview_fps = 12
preview_quality = 70
face_s = 5.0                     # capture window, from the first good crop (like enroll_s)
face_timeout_s = 30
face_rate_hz = 8                 # face prints per second at most
center_tol = 0.2                 # face centre this far off the middle: "move to the middle"
min_face_share = 0.22            # face narrower than this share of the preview: "come closer"
max_face_share = 0.8             # wider: "move back a little"
dominant_ratio = 1.3             # the person must be this much wider than any other face
same_person = 0.4                # every print this close to the first ones (one person only)
# station face vs the glasses face the save started from (median of best matches). LFW, real
# models, 143 people: the same person scored 0.55-0.84, different people -0.07-0.24
identity_match = 0.35
decision_timeout_s = 60          # "That isn't the person you were looking at" waits this long
sentence = "Every morning I walk my dog through the park, buy fresh bread and orange juice, and enjoy watching children play by the quiet river."
voice_timeout_s = 40
vad_start = 0.5
vad_end = 0.35
quiet_db = -42                   # voiced speech quieter than this (dBFS): "speak up"
loud_db = -8                     # louder, or clipping: "a bit softer"
clip_level = 0.98
min_snr_db = 10                  # speech this close to the noise floor: "too noisy"
pause_hint_s = 1.5               # silent this long before enough speech: "keep talking"
level_hz = 15                    # level meter messages per second
camera_source = ""               # tests / demos: a video file instead of the laptop camera
mic_source = ""                  # tests / demos: a WAV file instead of the laptop mic

[rhythm]
low_band = [470, 570]
high_band = [2800, 3400]
frame_s = 0.01
purity = 0.7
min_rms = 0.01
relative_energy = 5.0
tolerance = 0.2
t3_on_s = 0.5
t3_gap_s = 0.5
t3_rest_s = 1.5
t4_on_s = 0.1
t4_gap_s = 0.1
t4_rest_s = 5.0

[sound_model]
# TorchScript waveform -> 527 logits, including EfficientAT's mel frontend.
# Export locally using the upstream EfficientAT project; never load untrusted weights.
model_path = "models/efficientat-mn10-as.ts"
labels_path = "models/audioset-labels.json"
device = "cpu"

[calibration]
profile = "venue"
room_noise_s = 30
face_min_score = 0.5
