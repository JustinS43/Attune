# Shared file: change only in a [shared] PR (see AGENTS.md).
# Versions get pinned after the stack test T-S1; until then, leave them open.

[project]
name = "attune"
version = "0.0.0"
description = "AR captions for deaf and hard-of-hearing people (ShellHacks)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "python-dotenv",
]

[project.optional-dependencies]
# Section 1 - Vision (SCRFD and ArcFace ONNX files are run directly with onnxruntime-gpu)
vision = [
    "opencv-python",
    "onnxruntime-gpu",
    "mediapipe",
]
# Section 2 - Audio & Language
audio = [
    "sounddevice",
    "soxr",
    "silero-vad",
    "sherpa-onnx",          # GPU build: see docs/setup.md
    "faster-whisper",
    "lingua-language-detector",
    "torch",                # EfficientAT and Silero
    "torchaudio",
    "ollama",
]
# Section 3 - Hardware & Services
hardware = [
    "pyserial",
    "elevenlabs",
    "psycopg[binary]",
]
# Section 4 - Pages, Engine & Demo (core deps above)
dev = [
    "pytest",
    "ruff",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["attune"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["../tests"]
