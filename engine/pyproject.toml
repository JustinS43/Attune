# Shared file: change only in a [shared] PR (see AGENTS.md).
# Versions get pinned after the stack test T-S1; until then, leave them open.

[project]
name = "attune"
version = "0.0.0"
description = "AR captions for deaf and hard-of-hearing people (ShellHacks)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "python-dotenv",
]

[project.optional-dependencies]
# Section 1 - Vision (SCRFD and ArcFace ONNX files are run directly with onnxruntime-gpu)
vision = [
    "opencv-python",
    "onnxruntime-gpu[cuda,cudnn]; sys_platform != 'darwin'",  # brings CUDA 12 + cuDNN 9 runtime wheels
    "onnxruntime; sys_platform == 'darwin'",                  # CPU build for Mac development
    "mediapipe",
    "cv2-enumerate-cameras",                                  # open the webcam by name, not index
]
# Section 2 - Audio & Language
audio = [
    "sounddevice",
    "soxr",
    "silero-vad",
    "sherpa-onnx",          # GPU build: see docs/setup.md
    "sherpa-onnx-core",     # sherpa's own onnxruntime.dll; without it Windows loads System32's old one
    "faster-whisper",
    "lingua-language-detector",
    "torch",                # EfficientAT and Silero
    "torchaudio",
    "ollama",
]
# Section 3 - Hardware & Services
hardware = [
    "pyserial",
    "elevenlabs",
]
# Section 4 - Pages, Engine & Demo (core deps above)
dev = [
    "pytest",
    "ruff",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
# faster-whisper asks for the CPU "onnxruntime", which shares its folder with
# "onnxruntime-gpu" and overwrites it. Keep only the GPU build off macOS.
override-dependencies = ["onnxruntime; sys_platform == 'darwin'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }
torchaudio = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["attune"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["../tests"]
