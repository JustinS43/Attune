<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="title desc">
  <title id="title">Attune Horizon wordmark</title>
  <desc id="desc">The Attune name with a rising sun and open arcs.</desc>
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe1a5"/><stop offset="1" stop-color="#ed9d70"/></linearGradient>
