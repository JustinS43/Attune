  <text x="1402" y="938" text-anchor="end" fill="#789096" font-family="Avenir Next, Nunito Sans, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="650" letter-spacing="3">BUILT FOR A MORE ACCESSIBLE WORLD</text>
