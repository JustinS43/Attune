    <text x="7" y="310" fill="#173C45" font-family="Avenir Next, Nunito Sans, Segoe UI, system-ui, sans-serif" font-size="82" font-weight="700" letter-spacing="-3">
      <tspan x="7" dy="0">More awareness.</tspan>
      <tspan x="7" dy="100">More agency.</tspan>
    </text>
    <text x="10" y="570" fill="#526D73" font-family="Avenir Next, Nunito Sans, Segoe UI, system-ui, sans-serif" font-size="28" font-weight="500">
      <tspan x="10" dy="0">Live captions, familiar voices and sound alerts</tspan>
      <tspan x="10" dy="42">for Deaf and hard-of-hearing people.</tspan>
    </text>

    <g transform="translate(8 730)" font-family="Avenir Next, Nunito Sans, Segoe UI, system-ui, sans-serif" font-size="21" font-weight="650" fill="#17656C">
      <g><rect width="168" height="52" rx="26" fill="#DDF2EC"/><circle cx="28" cy="26" r="6" fill="#159B9E"/><text x="48" y="33">Live captions</text></g>
      <g transform="translate(184)"><rect width="190" height="52" rx="26" fill="#E4F2F0"/><circle cx="28" cy="26" r="6" fill="#97DCD0"/><text x="48" y="33">People aware</text></g>
      <g transform="translate(390)"><rect width="176" height="52" rx="26" fill="#FAE7D4"/><circle cx="28" cy="26" r="6" fill="#F4BC88"/><text x="48" y="33">Sound alerts</text></g>
