<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Attune · Demo</title>
  <link rel="icon" type="image/svg+xml" href="../shared/brand/attune-icon.svg">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="./demo.css?v=sound-meter-2">
  <link rel="stylesheet" href="./guide.css">
  <link rel="stylesheet" href="./pov.css">
  <script type="module" src="./demo.js?v=sound-meter-2"></script>
</head>
<body data-view="split">
  <header class="bar" aria-label="Demo controls">
    <div class="brand">
      <img class="brand-wordmark" src="../shared/brand/attune-wordmark-dark.svg" alt="Attune" width="112" height="30">
      <span class="sep">·</span>
      <span class="sub">Live demo</span>
    </div>
    <div class="views" role="radiogroup" aria-label="View">
      <button type="button" role="radio" data-view="split" title="Glasses and phone side by side (Alt+1)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="13" height="14" rx="2"/><rect x="17.5" y="5" width="4" height="14" rx="1.5"/></svg>
        <span>Glasses + Phone</span>
      </button>
      <button type="button" role="radio" data-view="lens" title="Glasses only (Alt+2)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/></svg>
        <span>Glasses</span>
      </button>
      <button type="button" role="radio" data-view="phone" title="Phone only (Alt+3)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="3" width="9" height="18" rx="2.2"/><path d="M11 18h2"/></svg>
        <span>Phone</span>
      </button>
      <button type="button" role="radio" data-view="guide" title="Which glasses show captions which way (Alt+4)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.8 11.2h2.4M19.8 11.2h2.4"/><rect x="3.2" y="8.2" width="7.6" height="7.4" rx="3"/><rect x="13.2" y="8.2" width="7.6" height="7.4" rx="3"/><path d="M10.8 10.8q1.2-1.1 2.4 0"/></svg>
        <span>Glasses guide</span>
      </button>
      <button type="button" role="radio" data-view="pov" title="As if you were wearing the glasses, full screen (Alt+5)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.8 10.6h1.6M20.6 10.6h1.6"/><rect x="3.2" y="7.4" width="7.8" height="8.6" rx="3.2"/><rect x="13" y="7.4" width="7.8" height="8.6" rx="3.2"/><path d="M11 9.6q1-0.9 2 0"/><circle cx="7.1" cy="11.8" r="1.35" class="fill"/><circle cx="16.9" cy="11.8" r="1.35" class="fill"/></svg>
        <span>Glasses POV</span>
      </button>
    </div>
    <div class="tools">
      <button type="button" class="cam-toggle" id="cam-toggle" aria-pressed="true" title="Turn the camera off or on (Alt+C)" disabled>
        <svg class="cam-on" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6.5" width="13" height="11" rx="2.2"/><path d="m15.5 10.5 5-3v9l-5-3"/></svg>
        <svg class="cam-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 13.5v2a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h1M9 6.5h4.5a2 2 0 0 1 2 2v2l5-3v9"/><path d="M3 3l18 18"/></svg>
        <span class="cam-label">Camera on</span>
      </button>
      <div class="hint"><kbd>`</kbd> switch view</div>
    </div>
  </header>

  <main class="stage">
    <section class="pane lens-pane" aria-label="Glasses view">
      <iframe id="lens" title="Attune glasses view" allow="autoplay; fullscreen"></iframe>
      <div class="sound-meter" id="sound-meter" role="group" aria-label="Glasses sound sensors" title="50 ms peak-to-peak amplitude (0–1023). Direction estimates left or right from changes above each sensor's baseline.">
        <span class="sound-direction" id="sound-direction">Sound · waiting</span>
        <span class="sound-values"><span>L <b id="sound-left">—</b></span><span>R <b id="sound-right">—</b></span></span>
      </div>
      <div class="cam-off-card" id="cam-off-card" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 13.5v2a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h1M9 6.5h4.5a2 2 0 0 1 2 2v2l5-3v9"/><path d="M3 3l18 18"/></svg>
        <h2>Camera off</h2>
        <p>Attune isn't looking. Captions and sound alerts keep working from the microphone.</p>
        <button type="button" class="cam-on-btn">Turn camera on</button>
      </div>
    </section>
    <section class="pane phone-pane" aria-label="Phone app">
      <div class="phone-fit">
        <div class="device">
          <iframe id="phone" title="Attune phone app"></iframe>
        </div>
      </div>
      <p class="caption">Attune phone app</p>
    </section>
  </main>

  <section class="pov" id="pov" aria-label="Glasses POV: what the wearer sees" tabindex="-1">
    <div class="pov-world"><iframe class="pov-lens" title="Attune glasses, seen by the wearer" allow="autoplay; fullscreen"></iframe></div>
    <div class="pov-peek" aria-hidden="true"></div>
    <div class="pov-tools" role="toolbar" aria-label="Glasses POV">
      <div class="pov-seg" role="group" aria-label="Glasses look (also sets the Glasses view)">
        <button type="button" data-pov-mode="color" aria-pressed="false" title="Meta Orion class">Colour</button>
        <button type="button" data-pov-mode="focused" aria-pressed="false" title="Bottom-third focused captions">Focused</button>
        <button type="button" data-pov-mode="mono" aria-pressed="false" title="Even Realities G1 class">Mono</button>
        <button type="button" data-pov-mode="corner" aria-pressed="false" title="Meta Ray-Ban Display class (G: Google Glass)">Corner</button>
      </div>
      <button type="button" class="pov-zoom" data-zoom="closer" title="Closer, or the whole camera frame (Z)"><span data-z="closer">Closer</span><i aria-hidden="true">/</i><span data-z="everything">Everything</span></button>
      <button type="button" class="pov-info-btn" aria-expanded="false" aria-controls="pov-info" aria-label="About this view">i</button>
      <span class="pov-exit" aria-hidden="true"><kbd>Esc</kbd> exit</span>
      <div class="pov-info" id="pov-info" role="note" hidden></div>
    </div>
    <div class="cam-off-card" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 13.5v2a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h1M9 6.5h4.5a2 2 0 0 1 2 2v2l5-3v9"/><path d="M3 3l18 18"/></svg>
      <h2>Camera off</h2>
      <p>Attune isn't looking. Captions and sound alerts keep working from the microphone.</p>
      <button type="button" class="cam-on-btn">Turn camera on</button>
    </div>
  </section>

  <section class="guide" id="guide" aria-labelledby="guide-title" tabindex="-1">
    <noscript><p class="guide-noscript">The glasses guide needs JavaScript.</p></noscript>
  </section>
</body>
</html>
